<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lightweight Charts</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722; 
            overflow: hidden; 
        }
        #chart-container {
            width: 100vw; 
            height: 100vh; 
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            autoSize: true, 
            layout: {
                background: { type: 'solid', color: '#131722' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
            },
        });

        const series = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
        });

        series.setData([
            { time: '2023-12-22', open: 75.16, high: 82.84, low: 36.16, close: 45.72 },
            { time: '2023-12-23', open: 45.12, high: 53.90, low: 45.12, close: 48.09 },
            { time: '2023-12-24', open: 60.71, high: 60.71, low: 53.39, close: 59.29 },
            { time: '2023-12-25', open: 68.26, high: 68.26, low: 59.04, close: 60.50 }
        ]);

        chart.timeScale().fitContent();
    </script>
</body>
</html>
